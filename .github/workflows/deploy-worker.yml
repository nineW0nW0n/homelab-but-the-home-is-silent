---
name: Deploy Worker
# Unnumbered, same reason as deploy.yml: GitHub supplies the run number.
run-name: deploy worker ${{ github.ref_name }}

on:
  push:
    branches: [main]
    paths:
      - worker/status/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # Rail 7: one approval gates production. Only one deploy job here, so the
  # environment sits on it directly -- no separate 'approve' job needed.
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: worker/status
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '22'

      # npm ci exists to pin wrangler to package-lock's version; there is
      # no test step because the Worker has no logic left to test -- it
      # serves three static files (poller retired 2026-09-03, phoenixlab
      # step 17), and its only importable modules went with the poller.

      - name: Install dependencies
        run: npm ci

      # Empty means the secret does not exist under this name. Names
      # only, never values. No Worker secrets are pushed anymore: the
      # poller and its Access service token wiring retired with it.
      - name: Reject empty secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bad=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "FAIL $name: empty or unset"
              bad=1
            fi
          done
          exit "$bad"

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0  # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker/status
