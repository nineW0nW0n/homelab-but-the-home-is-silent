---
name: deploy
# No number here on purpose: GitHub numbers the run itself (#53, #54 ...).
# The default title is the merge commit subject, which carries the PR number
# GitHub appends on squash -- so run #52 displayed as "(#51)" and read like
# two different numbers for the same thing.
run-name: deploy ${{ github.ref_name }}

on:
  push:
    branches: [main]
    # Only what actually reaches a node. infra/ was listed here until
    # 2026-08-19 but nothing under it is ever rsynced: the deploy jobs sync
    # stacks/vps0N/ only, and inventory.yaml is gitignored so it could
    # never have triggered anyway. The cost was real -- a docs-only edit to
    # infra/CLAUDE.md queued a full three-node production deploy that sat
    # 13h at the approval gate and, once approved, shipped a by-then stale
    # deploy.yml that wiped vps01's backup state.
    paths:
      - stacks/**
      - .github/workflows/deploy.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # The single production gate. It exists so one approval covers the whole
  # run: an 'environment:' on each deploy job would prompt three times.
  # Every secret these jobs use is repository-scoped, so the deploy jobs
  # lose nothing by not declaring the environment themselves.
  approve:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Gate
        run: echo "approved - deploying vps00, vps01 and vps02 in parallel"

  deploy-vps00:
    needs: approve
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ vars.VPS00_SSH_PORT || 22 }}
      SSH_USER: ${{ vars.VPS00_SSH_USER || 'deploy' }}
      SSH_HOST: ${{ secrets.VPS00_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_VPS00 }}

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote stack dir
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/stacks/vps00'

      - name: Sync stack files
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            stacks/vps00/ "$SSH_USER@$SSH_HOST:/opt/stacks/vps00/"

      - name: Write remote .env
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
          OPENOBSERVE_INGEST_USER: ${{ secrets.OPENOBSERVE_INGEST_USER }}
          OPENOBSERVE_INGEST_PASSWORD: ${{ secrets.OPENOBSERVE_INGEST_PASSWORD }}
          CF_ACCESS_SIEM_CLIENT_ID: ${{ secrets.CF_ACCESS_SIEM_CLIENT_ID }}
          CF_ACCESS_SIEM_CLIENT_SECRET: ${{ secrets.CF_ACCESS_SIEM_CLIENT_SECRET }}
        run: |
          # One remote write: these printfs are grouped and piped together
          # into a single 'cat >', not '>>', so every value the stack needs
          # has to be printed here or it is lost. Split into one printf per
          # key (not one long format string) so no line exceeds yamllint's
          # 120 chars.
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$TUNNEL_TOKEN"
            printf 'NETDATA_CLAIM_TOKEN=%s\n' "$NETDATA_CLAIM_TOKEN"
            printf 'NETDATA_CLAIM_ROOMS=%s\n' "$NETDATA_CLAIM_ROOMS"
            printf 'OPENOBSERVE_INGEST_USER=%s\n' "$OPENOBSERVE_INGEST_USER"
            printf 'OPENOBSERVE_INGEST_PASSWORD=%s\n' "$OPENOBSERVE_INGEST_PASSWORD"
            printf 'CF_ACCESS_SIEM_CLIENT_ID=%s\n' "$CF_ACCESS_SIEM_CLIENT_ID"
            printf 'CF_ACCESS_SIEM_CLIENT_SECRET=%s\n' "$CF_ACCESS_SIEM_CLIENT_SECRET"
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps00/.env'

      - name: Write remote health_alarm_notify.conf
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed \
            -e "s|__TELEGRAM_BOT_TOKEN__|$TELEGRAM_BOT_TOKEN|" \
            -e "s|__TELEGRAM_CHAT_ID__|$TELEGRAM_CHAT_ID|" \
            stacks/vps00/health_alarm_notify.conf.template | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'docker run --rm -i -v vps00_netdataconfig:/etc/netdata alpine:3.21 \
               sh -c "cat > /etc/netdata/health_alarm_notify.conf && \
                      chown 201:201 /etc/netdata/health_alarm_notify.conf && \
                      chmod 600 /etc/netdata/health_alarm_notify.conf"'

      - name: Deploy vps00
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /opt/stacks/vps00 && \
             if [ -n "$(docker compose config --services 2>/dev/null)" ]; then \
               docker compose pull && docker compose up -d && docker image prune -f && \
               docker compose restart netdata; \
             else \
               echo "no services defined, skipping compose pull/up"; \
             fi'

      - name: Verify vps00
        run: |
          # Probed from the node, not the runner: a zone-wide Cloudflare
          # custom rule ("Block non-local traffic") blocks every request
          # whose source country is not PH, so the public hostnames 403 from
          # GitHub Actions while the service is perfectly healthy. Only the
          # apex is exempt. The origin is what CI can honestly assert; the
          # edge and tunnel path is covered by the status page and Netdata
          # Cloud.
          #
          # Polls rather than asking once: the Deploy step above ends with
          # 'docker compose restart netdata', and Netdata answers 503 for a
          # few seconds while it initialises. Measured at ~5s on a real
          # node; 60s of patience costs nothing when everything is healthy
          # and still fails fast enough to be useful.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -eu
            probe() {
              label=$1
              url=$2
              host=${3:-}
              i=0
              while [ $i -lt 30 ]; do
                if [ -n "$host" ]; then
                  code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 \
                    -H "Host: $host" "$url" || true)
                else
                  code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "$url" \
                    || true)
                fi
                if [ "$code" = 200 ]; then
                  echo "ok   $label"
                  return 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "FAIL $label: last code $code"
              return 1
            }
            probe netdata http://127.0.0.1:19999/api/v1/info
            # 2>/dev/null || echo missing: unguarded, set -e kills the
            # script at this assignment when the container does not
            # exist, so the FAIL line below never prints and the log
            # shows docker stderr instead. A rename is plausible --
            # see the Dokploy project-prefix warning in stacks/vps01/CLAUDE.md.
            running=$(docker inspect -f "{{.State.Running}}" \
              cloudflared-vps00 2>/dev/null || echo missing)
            [ "$running" = true ] || { echo "FAIL cloudflared: $running"; exit 1; }
            echo "ok   cloudflared"
            running=$(docker inspect -f "{{.State.Running}}" \
              vector 2>/dev/null || echo missing)
            [ "$running" = true ] || { echo "FAIL vector: $running"; exit 1; }
            echo "ok   vector"
          '

  deploy-vps01:
    needs: approve
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ vars.VPS01_SSH_PORT || 22 }}
      SSH_USER: ${{ vars.VPS01_SSH_USER || 'deploy' }}
      SSH_HOST: ${{ secrets.VPS01_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_VPS01 }}

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote stack dir
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/stacks/vps01'

      - name: Sync stack files
        run: |
          # backup/ and backup-booking/ hold the run logs, the
          # .last-success stamps the staleness check reads, and the local
          # archives: node state, not repo state. --delete wiped backup/ on
          # every deploy until 2026-08-18.
          #
          # The two credential files are excluded for a subtler reason:
          # --delete removes them here and later steps write them back, so
          # they are absent for a few seconds every deploy.
          # check-backup-age.sh runs at :30 every hour with no schedule
          # gate, so a deploy overlapping it exits 1 on "ERROR:
          # .telegram.env missing" and that hour's staleness check is
          # silently skipped. .env is deliberately NOT excluded: nothing
          # reads it between the rsync and its rewrite.
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            --exclude 'backup/' --exclude 'backup-booking/' \
            --exclude '.r2.env' --exclude '.telegram.env' \
            stacks/vps01/ "$SSH_USER@$SSH_HOST:/opt/stacks/vps01/"

      - name: Write remote .env
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS01_BOOKING }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
          OPENOBSERVE_INGEST_USER: ${{ secrets.OPENOBSERVE_INGEST_USER }}
          OPENOBSERVE_INGEST_PASSWORD: ${{ secrets.OPENOBSERVE_INGEST_PASSWORD }}
          CF_ACCESS_SIEM_CLIENT_ID: ${{ secrets.CF_ACCESS_SIEM_CLIENT_ID }}
          CF_ACCESS_SIEM_CLIENT_SECRET: ${{ secrets.CF_ACCESS_SIEM_CLIENT_SECRET }}
        run: |
          # One remote write: these printfs are grouped and piped together
          # into a single 'cat >', not '>>', so every value the stack needs
          # has to be printed here or it is lost. Split into one printf per
          # key (not one long format string) so no line exceeds yamllint's
          # 120 chars.
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN_VPS01_BOOKING=%s\n' "$TUNNEL_TOKEN"
            printf 'NETDATA_CLAIM_TOKEN=%s\n' "$NETDATA_CLAIM_TOKEN"
            printf 'NETDATA_CLAIM_ROOMS=%s\n' "$NETDATA_CLAIM_ROOMS"
            printf 'OPENOBSERVE_INGEST_USER=%s\n' "$OPENOBSERVE_INGEST_USER"
            printf 'OPENOBSERVE_INGEST_PASSWORD=%s\n' "$OPENOBSERVE_INGEST_PASSWORD"
            printf 'CF_ACCESS_SIEM_CLIENT_ID=%s\n' "$CF_ACCESS_SIEM_CLIENT_ID"
            printf 'CF_ACCESS_SIEM_CLIENT_SECRET=%s\n' "$CF_ACCESS_SIEM_CLIENT_SECRET"
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.env'

      - name: Write remote health_alarm_notify.conf
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed \
            -e "s|__TELEGRAM_BOT_TOKEN__|$TELEGRAM_BOT_TOKEN|" \
            -e "s|__TELEGRAM_CHAT_ID__|$TELEGRAM_CHAT_ID|" \
            stacks/vps01/health_alarm_notify.conf.template | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'docker run --rm -i -v vps01_netdataconfig:/etc/netdata alpine:3.21 \
               sh -c "cat > /etc/netdata/health_alarm_notify.conf && \
                      chown 201:201 /etc/netdata/health_alarm_notify.conf && \
                      chmod 600 /etc/netdata/health_alarm_notify.conf"'

      - name: Write remote R2 backup credentials
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf 'RCLONE_CONFIG_R2_ACCESS_KEY_ID=%s\nRCLONE_CONFIG_R2_SECRET_ACCESS_KEY=%s\n' \
            "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.r2.env'

      - name: Write remote Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' \
            "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.telegram.env'

      - name: Install backup cron
        run: |
          # Debian's cron ignores CRON_TZ, so these fire hourly in the node's
          # own zone; backup-ezbookkeeping.sh gates itself on 03:00 and
          # backup-booking.sh on 04:00 Asia/Manila (staggered: 2GB node).
          # Nothing here depends on the host clock's zone.
          #
          # All four entries go in one heredoc because 'crontab -' REPLACES
          # the whole crontab; installing a job separately would delete the
          # others. See stacks/vps01/CLAUDE.md.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /opt/stacks/vps01/backup /opt/stacks/vps01/backup-booking'
          {
            printf '0 * * * * /opt/stacks/vps01/backup-ezbookkeeping.sh'
            printf ' >> /opt/stacks/vps01/backup/backup.log 2>&1\n'
            printf '30 * * * * /opt/stacks/vps01/check-backup-age.sh'
            printf ' >> /opt/stacks/vps01/backup/check.log 2>&1\n'
            printf '10 * * * * /opt/stacks/vps01/backup-booking.sh'
            printf ' >> /opt/stacks/vps01/backup-booking/backup.log 2>&1\n'
            printf '40 * * * * /opt/stacks/vps01/check-backup-age.sh'
            printf ' booking /opt/stacks/vps01/backup-booking'
            printf ' >> /opt/stacks/vps01/backup-booking/check.log 2>&1\n'
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'crontab -'

      - name: Deploy vps01
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /opt/stacks/vps01 && \
             if [ -n "$(docker compose config --services 2>/dev/null)" ]; then \
               docker compose pull && docker compose up -d && docker image prune -f && \
               docker compose restart netdata; \
             else \
               echo "no services defined, skipping compose pull/up"; \
             fi'

      - name: Verify vps01
        run: |
          # Probed from the node, not the runner: a zone-wide Cloudflare
          # custom rule ("Block non-local traffic") blocks every request
          # whose source country is not PH, so the public hostnames 403 from
          # GitHub Actions while the service is perfectly healthy. Only the
          # apex is exempt. The origin is what CI can honestly assert; the
          # edge and tunnel path is covered by the status page and Netdata
          # Cloud.
          #
          # Polls rather than asking once: the Deploy step above ends with
          # 'docker compose restart netdata', and Netdata answers 503 for a
          # few seconds while it initialises. Measured at ~5s on a real
          # node; 60s of patience costs nothing when everything is healthy
          # and still fails fast enough to be useful.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -eu
            probe() {
              label=$1
              url=$2
              host=${3:-}
              i=0
              while [ $i -lt 30 ]; do
                if [ -n "$host" ]; then
                  code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 \
                    -H "Host: $host" "$url" || true)
                else
                  code=$(curl -s -o /dev/null -w "%{http_code}" -m 5 "$url" \
                    || true)
                fi
                if [ "$code" = 200 ]; then
                  echo "ok   $label"
                  return 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "FAIL $label: last code $code"
              return 1
            }
            probe netdata http://127.0.0.1:19999/api/v1/info
            # 2>/dev/null || echo missing: unguarded, set -e kills the
            # script at this assignment when the container does not
            # exist, so the FAIL line below never prints and the log
            # shows docker stderr instead. A rename is plausible --
            # see the Dokploy project-prefix warning in stacks/vps01/CLAUDE.md.
            running=$(docker inspect -f "{{.State.Running}}" \
              cloudflared-vps01 2>/dev/null || echo missing)
            [ "$running" = true ] || { echo "FAIL cloudflared: $running"; exit 1; }
            echo "ok   cloudflared"
            running=$(docker inspect -f "{{.State.Running}}" \
              vector 2>/dev/null || echo missing)
            [ "$running" = true ] || { echo "FAIL vector: $running"; exit 1; }
            echo "ok   vector"
            probe "booking via Traefik" http://127.0.0.1:80/ booking.maybeit.work
            probe "budget via Traefik" http://127.0.0.1:80/ budget.maybeit.work
          '

