            probe openobserve http://127.0.0.1:5080/healthz
            running=$(docker inspect -f "{{.State.Running}}" \
              vector 2>/dev/null || echo missing)
            [ "$running" = true ] || { echo "FAIL vector: $running"; exit 1; }
            echo "ok   vector"
          '
