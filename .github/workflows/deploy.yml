---
name: deploy
# No number here on purpose: GitHub numbers the run itself (#53, #54 ...).
# The default title is the merge commit subject, which carries the PR number
# GitHub appends on squash -- so run #52 displayed as "(#51)" and read like
# two different numbers for the same thing.
run-name: deploy ${{ github.ref_name }}

on:
  push:
    branches: [main]
    # Only what actually reaches a node. infra/ was listed here until
    # 2026-08-19 but nothing under it is ever rsynced: the deploy jobs sync
    # stacks/vps0N/ only, and inventory.yaml is gitignored so it could
    # never have triggered anyway. The cost was real -- a docs-only edit to
    # infra/CLAUDE.md queued a full three-node production deploy that sat
    # 13h at the approval gate and, once approved, shipped a by-then stale
    # deploy.yml that wiped vps01's backup state.
    #
    # The same lesson, one directory further in: stacks/** matches
    # stacks/CLAUDE.md and stacks/vps01/CLAUDE.md, so editing documentation
    # queued a production deploy on 2026-08-23. Negated patterns exclude
    # them. Negation is only available inside paths -- paths and
    # paths-ignore cannot both be set for one event -- and later patterns
    # win, so the exclusions must stay below what they narrow. Both forms
    # are listed because ** matches across slashes and so does not
    # reliably match the top-level stacks/CLAUDE.md, which is the exact
    # file that triggered the deploy this fixes.
    paths:
      - stacks/**
      - '!stacks/CLAUDE.md'
      - '!stacks/**/CLAUDE.md'
      - .github/workflows/deploy.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # The single production gate. It exists so one approval covers the whole
  # run: an 'environment:' on each deploy job would prompt three times.
  # Every secret these jobs use is repository-scoped, so the deploy jobs
  # lose nothing by not declaring the environment themselves.
  approve:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Gate
        run: echo "approved - deploying vps00, vps01 and vps02 in parallel"

      # Runs once, before any node deploys, because all three hang off
      # this job. Values are read from the environment and only NAMES are
      # ever printed.
      - name: Reject secrets a dotenv parser would mangle
        env:
          CLOUDFLARE_TUNNEL_TOKEN_VPS00: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS00 }}
          CLOUDFLARE_TUNNEL_TOKEN_VPS01: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS01 }}
          CLOUDFLARE_TUNNEL_TOKEN_VPS02: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS02 }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
          OPENOBSERVE_ROOT_EMAIL: ${{ secrets.OPENOBSERVE_ROOT_EMAIL }}
          OPENOBSERVE_ROOT_PASSWORD: ${{ secrets.OPENOBSERVE_ROOT_PASSWORD }}
          OPENOBSERVE_INGEST_USER: ${{ secrets.OPENOBSERVE_INGEST_USER }}
          OPENOBSERVE_INGEST_PASSWORD: ${{ secrets.OPENOBSERVE_INGEST_PASSWORD }}
          CLOUDFLARE_ACCESS_SIEM_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_SIEM_CLIENT_ID }}
          CLOUDFLARE_ACCESS_SIEM_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_SIEM_CLIENT_SECRET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOOKING_MYSQL_ROOT_PASSWORD: ${{ secrets.BOOKING_MYSQL_ROOT_PASSWORD }}
          BOOKING_MYSQL_APP_PASSWORD: ${{ secrets.BOOKING_MYSQL_APP_PASSWORD }}
          BUDGET_SECRET_KEY: ${{ secrets.BUDGET_SECRET_KEY }}
          WIKI_GIT_TOKEN: ${{ secrets.WIKI_GIT_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          USER_GOOGLE_EMAIL: ${{ secrets.USER_GOOGLE_EMAIL }}
        run: |
          # Compose truncates an unquoted .env value at '#' and
          # interpolates '$'; the shell scripts that source .r2.env and
          # .telegram.env mangle the same characters. A 32-character
          # OpenObserve password containing '#' reached the container as
          # 21 characters, created the root user with the truncation, and
          # nothing anywhere reported it -- the whole log stack failed
          # authentication instead. See stacks/CLAUDE.md.
          bad=0
          for name in \
            CLOUDFLARE_TUNNEL_TOKEN_VPS00 \
            CLOUDFLARE_TUNNEL_TOKEN_VPS01 \
            CLOUDFLARE_TUNNEL_TOKEN_VPS02 \
            NETDATA_CLAIM_TOKEN \
            NETDATA_CLAIM_ROOMS \
            OPENOBSERVE_ROOT_EMAIL \
            OPENOBSERVE_ROOT_PASSWORD \
            OPENOBSERVE_INGEST_USER \
            OPENOBSERVE_INGEST_PASSWORD \
            CLOUDFLARE_ACCESS_SIEM_CLIENT_ID \
            CLOUDFLARE_ACCESS_SIEM_CLIENT_SECRET \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            TELEGRAM_BOT_TOKEN \
            TELEGRAM_CHAT_ID \
            BOOKING_MYSQL_ROOT_PASSWORD \
            BOOKING_MYSQL_APP_PASSWORD \
            BUDGET_SECRET_KEY \
            WIKI_GIT_TOKEN \
            GOOGLE_OAUTH_CLIENT_ID \
            GOOGLE_OAUTH_CLIENT_SECRET \
            USER_GOOGLE_EMAIL \
            ; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ]; then
              case "$name" in
                NETDATA_CLAIM_TOKEN|NETDATA_CLAIM_ROOMS)
                  # Documented harmless when unset: an already-claimed
                  # agent keeps its identity (stacks/CLAUDE.md).
                  echo "skip $name: not set (optional)"
                  continue
                  ;;
              esac
              # Empty means the secret does not exist under this name --
              # a typo'd rename used to render empty and deploy anyway.
              echo "FAIL $name: empty or unset"
              bad=1
              continue
            fi
            case "$value" in
              *'#'*|*'$'*|*'"'*|*"'"*|*\\*|*'`'*)
                echo "FAIL $name: contains a character a dotenv parser"
                echo "     mangles -- hash, dollar, double quote, apostrophe,"
                echo "     backslash or backtick. It would be silently truncated"
                echo "     or rewritten. Rotate it to a value without them."
                bad=1
                ;;
            esac
            case "$value" in
              ' '*|*' ')
                echo "FAIL $name: has leading or trailing whitespace"
                bad=1
                ;;
            esac
          done
          # OpenObserve enforces its own policy on the root password and
          # panics at startup if it is not met, which surfaces as a
          # crashloop rather than anything naming the password. Its
          # "special character" set is wider than this, but ! @ % - _ are
          # measured-accepted (v0.92.2) and are exactly the specials the
          # dotenv rule above leaves intact -- so this asks for one of
          # those rather than for any symbol.
          for name in OPENOBSERVE_ROOT_PASSWORD OPENOBSERVE_INGEST_PASSWORD; do
            value=$(printenv "$name" || true)
            if [ -z "$value" ]; then
              continue
            fi
            len=${#value}
            if [ "$len" -lt 8 ] || [ "$len" -gt 128 ]; then
              echo "FAIL $name: OpenObserve wants 8-128 characters, this is $len"
              bad=1
            fi
            printf '%s' "$value" | grep -q '[a-z]' ||
              { echo "FAIL $name: needs a lowercase letter"; bad=1; }
            printf '%s' "$value" | grep -q '[A-Z]' ||
              { echo "FAIL $name: needs an uppercase letter"; bad=1; }
            printf '%s' "$value" | grep -q '[0-9]' ||
              { echo "FAIL $name: needs a digit"; bad=1; }
            printf '%s' "$value" | grep -q '[!@%_-]' ||
              { echo "FAIL $name: needs one of  ! @ % - _  (OpenObserve wants a"
                echo "     special character; those five are the ones a dotenv"
                echo "     parser also leaves alone)"; bad=1; }
          done
          if [ "$bad" != 0 ]; then
            echo "Refusing to deploy. Nothing has been written to any node."
            exit 1
          fi
          echo "ok: every secret that lands in a dotenv file is parser-safe"
          echo "ok: the OpenObserve passwords meet its startup policy"

  # One matrix job, three parallel legs, still hanging off the single
  # approve gate (rail 7): needs: approve is inherited by every leg, so one
  # approval covers all three nodes exactly as the three separate jobs did.
  # fail-fast: false because the legs were independent jobs before -- one
  # node failing must not cancel the other two mid-deploy.
  #
  # Each include entry carries both the lowercase node id (paths, container
  # names) and the uppercase suffix: secrets[format('SSH_HOST_{0}', ...)]
  # needs VPS0N and expressions cannot uppercase a string. verify_args are
  # the arguments scripts/verify-node.sh documents: netdata port,
  # openobserve /healthz port or '-', app probes or '-', then the
  # containers whose restart counters are sampled.
  deploy:
    name: deploy-${{ matrix.node }}
    needs: approve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: vps00
            suffix: VPS00
            verify_args: >-
              8050 - wiki:8001,gws-mcp:8051 cloudflared-vps00 vector
              wiki-builder wiki-web wiki-mcp gws-mcp
          - node: vps01
            suffix: VPS01
            verify_args: >-
              8150 - booking:8101,budget:8102
              cloudflared-vps01 vector booking-ptpwn8-mysql-1 ezbookkeeping
          - node: vps02
            suffix: VPS02
            verify_args: 8250 8251 - cloudflared-vps02 openobserve vector
    env:
      NODE: ${{ matrix.node }}
      SSH_PORT: ${{ vars[format('{0}_SSH_PORT', matrix.suffix)] || 22 }}
      SSH_USER: ${{ vars[format('{0}_SSH_USER', matrix.suffix)] || 'deploy' }}
      SSH_HOST: ${{ secrets[format('SSH_HOST_{0}', matrix.suffix)] }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets[format('SSH_PRIVATE_KEY_{0}', matrix.suffix)] }}

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote stack dir
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /opt/stacks/$NODE"

      - name: Sync stack files
        if: matrix.node != 'vps01'
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            "stacks/$NODE/" "$SSH_USER@$SSH_HOST:/opt/stacks/$NODE/"

      - name: Sync stack files (vps01)
        if: matrix.node == 'vps01'
        run: |
          # backup/ and backup-booking/ hold the run logs, the
          # .last-success stamps the staleness check reads, and the local
          # archives: node state, not repo state. --delete wiped backup/ on
          # every deploy until 2026-08-18.
          #
          # The two credential files are excluded for a subtler reason:
          # --delete removes them here and later steps write them back, so
          # they are absent for a few seconds every deploy.
          # check-backup-age.sh runs at :30 every hour with no schedule
          # gate, so a deploy overlapping it exits 1 on "ERROR:
          # .telegram.env missing" and that hour's staleness check is
          # silently skipped. .env is deliberately NOT excluded: nothing
          # reads it between the rsync and its rewrite.
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            --exclude 'backup/' --exclude 'backup-booking/' \
            --exclude '.r2.env' --exclude '.telegram.env' \
            stacks/vps01/ "$SSH_USER@$SSH_HOST:/opt/stacks/vps01/"

      # The three .env steps stay per-node: each node's stack reads a
      # different key set, and the tunnel-token key name differs too.
      - name: Write remote .env (vps00)
        if: matrix.node == 'vps00'
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS00 }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
          OPENOBSERVE_INGEST_USER: ${{ secrets.OPENOBSERVE_INGEST_USER }}
          OPENOBSERVE_INGEST_PASSWORD: ${{ secrets.OPENOBSERVE_INGEST_PASSWORD }}
          CF_ACCESS_SIEM_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_SIEM_CLIENT_ID }}
          CF_ACCESS_SIEM_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_SIEM_CLIENT_SECRET }}
          WIKI_GIT_TOKEN: ${{ secrets.WIKI_GIT_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          USER_GOOGLE_EMAIL: ${{ secrets.USER_GOOGLE_EMAIL }}
        run: |
          # One remote write: these printfs are grouped and piped together
          # into a single 'cat >', not '>>', so every value the stack needs
          # has to be printed here or it is lost. Split into one printf per
          # key (not one long format string) so no line exceeds yamllint's
          # 120 chars. Same shape in the vps01/vps02 steps below.
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\n' "$TUNNEL_TOKEN"
            printf 'NETDATA_CLAIM_TOKEN=%s\n' "$NETDATA_CLAIM_TOKEN"
            printf 'NETDATA_CLAIM_ROOMS=%s\n' "$NETDATA_CLAIM_ROOMS"
            printf 'OPENOBSERVE_INGEST_USER=%s\n' "$OPENOBSERVE_INGEST_USER"
            printf 'OPENOBSERVE_INGEST_PASSWORD=%s\n' "$OPENOBSERVE_INGEST_PASSWORD"
            printf 'CF_ACCESS_SIEM_CLIENT_ID=%s\n' "$CF_ACCESS_SIEM_CLIENT_ID"
            printf 'CF_ACCESS_SIEM_CLIENT_SECRET=%s\n' "$CF_ACCESS_SIEM_CLIENT_SECRET"
            printf 'WIKI_GIT_TOKEN=%s\n' "$WIKI_GIT_TOKEN"
            printf 'GOOGLE_OAUTH_CLIENT_ID=%s\n' "$GOOGLE_OAUTH_CLIENT_ID"
            printf 'GOOGLE_OAUTH_CLIENT_SECRET=%s\n' "$GOOGLE_OAUTH_CLIENT_SECRET"
            printf 'USER_GOOGLE_EMAIL=%s\n' "$USER_GOOGLE_EMAIL"
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps00/.env'

      - name: Write remote .env (vps01)
        if: matrix.node == 'vps01'
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS01 }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
          OPENOBSERVE_INGEST_USER: ${{ secrets.OPENOBSERVE_INGEST_USER }}
          OPENOBSERVE_INGEST_PASSWORD: ${{ secrets.OPENOBSERVE_INGEST_PASSWORD }}
          CF_ACCESS_SIEM_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_SIEM_CLIENT_ID }}
          CF_ACCESS_SIEM_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_SIEM_CLIENT_SECRET }}
          BOOKING_MYSQL_ROOT_PASSWORD: ${{ secrets.BOOKING_MYSQL_ROOT_PASSWORD }}
          BOOKING_MYSQL_APP_PASSWORD: ${{ secrets.BOOKING_MYSQL_APP_PASSWORD }}
          BUDGET_SECRET_KEY: ${{ secrets.BUDGET_SECRET_KEY }}
        run: |
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN_VPS01_BOOKING=%s\n' "$TUNNEL_TOKEN"
            printf 'NETDATA_CLAIM_TOKEN=%s\n' "$NETDATA_CLAIM_TOKEN"
            printf 'NETDATA_CLAIM_ROOMS=%s\n' "$NETDATA_CLAIM_ROOMS"
            printf 'OPENOBSERVE_INGEST_USER=%s\n' "$OPENOBSERVE_INGEST_USER"
            printf 'OPENOBSERVE_INGEST_PASSWORD=%s\n' "$OPENOBSERVE_INGEST_PASSWORD"
            printf 'CF_ACCESS_SIEM_CLIENT_ID=%s\n' "$CF_ACCESS_SIEM_CLIENT_ID"
            printf 'CF_ACCESS_SIEM_CLIENT_SECRET=%s\n' "$CF_ACCESS_SIEM_CLIENT_SECRET"
            printf 'BOOKING_MYSQL_ROOT_PASSWORD=%s\n' "$BOOKING_MYSQL_ROOT_PASSWORD"
            printf 'BOOKING_MYSQL_APP_PASSWORD=%s\n' "$BOOKING_MYSQL_APP_PASSWORD"
            printf 'BUDGET_SECRET_KEY=%s\n' "$BUDGET_SECRET_KEY"
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.env'

      - name: Write remote .env (vps02)
        if: matrix.node == 'vps02'
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS02 }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
          OPENOBSERVE_ROOT_EMAIL: ${{ secrets.OPENOBSERVE_ROOT_EMAIL }}
          OPENOBSERVE_ROOT_PASSWORD: ${{ secrets.OPENOBSERVE_ROOT_PASSWORD }}
          OPENOBSERVE_INGEST_USER: ${{ secrets.OPENOBSERVE_INGEST_USER }}
          OPENOBSERVE_INGEST_PASSWORD: ${{ secrets.OPENOBSERVE_INGEST_PASSWORD }}
        run: |
          {
            printf 'CLOUDFLARE_TUNNEL_TOKEN_VPS02_METRICS=%s\n' "$TUNNEL_TOKEN"
            printf 'NETDATA_CLAIM_TOKEN=%s\n' "$NETDATA_CLAIM_TOKEN"
            printf 'NETDATA_CLAIM_ROOMS=%s\n' "$NETDATA_CLAIM_ROOMS"
            printf 'OPENOBSERVE_ROOT_EMAIL=%s\n' "$OPENOBSERVE_ROOT_EMAIL"
            printf 'OPENOBSERVE_ROOT_PASSWORD=%s\n' "$OPENOBSERVE_ROOT_PASSWORD"
            printf 'OPENOBSERVE_INGEST_USER=%s\n' "$OPENOBSERVE_INGEST_USER"
            printf 'OPENOBSERVE_INGEST_PASSWORD=%s\n' "$OPENOBSERVE_INGEST_PASSWORD"
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps02/.env'

      - name: Write remote health_alarm_notify.conf
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed \
            -e "s|__TELEGRAM_BOT_TOKEN__|$TELEGRAM_BOT_TOKEN|" \
            -e "s|__TELEGRAM_CHAT_ID__|$TELEGRAM_CHAT_ID|" \
            "stacks/$NODE/health_alarm_notify.conf.template" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "docker run --rm -i -v ${NODE}_netdataconfig:/etc/netdata alpine:3.21 \
               sh -c 'cat > /etc/netdata/health_alarm_notify.conf && \
                      chown 201:201 /etc/netdata/health_alarm_notify.conf && \
                      chmod 600 /etc/netdata/health_alarm_notify.conf'"

      - name: Write remote R2 backup credentials
        if: matrix.node == 'vps01'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf 'RCLONE_CONFIG_R2_ACCESS_KEY_ID=%s\nRCLONE_CONFIG_R2_SECRET_ACCESS_KEY=%s\n' \
            "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.r2.env'

      - name: Write remote Telegram credentials
        if: matrix.node == 'vps01'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' \
            "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.telegram.env'

      - name: Install backup cron
        if: matrix.node == 'vps01'
        run: |
          # Debian's cron ignores CRON_TZ, so these fire hourly in the node's
          # own zone; backup-ezbookkeeping.sh gates itself on 03:00 and
          # backup-booking.sh on 04:00 Asia/Manila (staggered: 2GB node).
          # Nothing here depends on the host clock's zone.
          #
          # All four entries go in one heredoc because 'crontab -' REPLACES
          # the whole crontab; installing a job separately would delete the
          # others. See stacks/vps01/CLAUDE.md.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'mkdir -p /opt/stacks/vps01/backup /opt/stacks/vps01/backup-booking'
          {
            printf '0 * * * * /opt/stacks/vps01/backup-ezbookkeeping.sh'
            printf ' >> /opt/stacks/vps01/backup/backup.log 2>&1\n'
            printf '30 * * * * /opt/stacks/vps01/check-backup-age.sh'
            printf ' >> /opt/stacks/vps01/backup/check.log 2>&1\n'
            printf '10 * * * * /opt/stacks/vps01/backup-booking.sh'
            printf ' >> /opt/stacks/vps01/backup-booking/backup.log 2>&1\n'
            printf '40 * * * * /opt/stacks/vps01/check-backup-age.sh'
            printf ' booking /opt/stacks/vps01/backup-booking'
            printf ' >> /opt/stacks/vps01/backup-booking/check.log 2>&1\n'
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'crontab -'

      - name: Deploy ${{ matrix.node }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd /opt/stacks/$NODE && \
             if [ -n \"\$(docker compose config --services 2>/dev/null)\" ]; then \
               docker compose pull && docker compose up -d && docker image prune -f && \
               docker compose restart netdata vector; \
             else \
               echo 'no services defined, skipping compose pull/up'; \
             fi"

      - name: Verify ${{ matrix.node }}
        env:
          VERIFY_ARGS: ${{ matrix.verify_args }}
        run: |
          # The checks themselves -- and the incident comments behind them
          # (country-rule 403s, the 503 restart race, restart-counter
          # aliveness, the 75s window) -- live in scripts/verify-node.sh,
          # which runs on the node over the SSH connection this job holds.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sh -s -- $VERIFY_ARGS" \
            < scripts/verify-node.sh
