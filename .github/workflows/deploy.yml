---
name: deploy

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - stacks/**
      - .github/workflows/deploy.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  # The single production gate. It exists so one approval covers the whole
  # run: an 'environment:' on each deploy job would prompt three times.
  # Every secret these jobs use is repository-scoped, so the deploy jobs
  # lose nothing by not declaring the environment themselves.
  approve:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Gate
        run: echo "approved - deploying vps00, vps01 and vps02 in parallel"

  deploy-vps00:
    needs: approve
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ vars.VPS00_SSH_PORT || 22 }}
      SSH_USER: ${{ vars.VPS00_SSH_USER || 'deploy' }}
      SSH_HOST: ${{ secrets.VPS00_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_VPS00 }}

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote stack dir
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/stacks/vps00'

      - name: Sync stack files
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            stacks/vps00/ "$SSH_USER@$SSH_HOST:/opt/stacks/vps00/"

      - name: Write remote .env
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
        run: |
          # One file, one write: this is 'cat >', not '>>', so every value
          # the stack needs has to be printed here or it is lost.
          printf 'CLOUDFLARE_TUNNEL_TOKEN=%s\nNETDATA_CLAIM_TOKEN=%s\nNETDATA_CLAIM_ROOMS=%s\n' \
            "$TUNNEL_TOKEN" "$NETDATA_CLAIM_TOKEN" "$NETDATA_CLAIM_ROOMS" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps00/.env'

      - name: Write remote health_alarm_notify.conf
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed \
            -e "s|__TELEGRAM_BOT_TOKEN__|$TELEGRAM_BOT_TOKEN|" \
            -e "s|__TELEGRAM_CHAT_ID__|$TELEGRAM_CHAT_ID|" \
            stacks/vps00/health_alarm_notify.conf.template | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'docker run --rm -i -v vps00_netdataconfig:/etc/netdata alpine:3.21 \
               sh -c "cat > /etc/netdata/health_alarm_notify.conf && \
                      chown 201:201 /etc/netdata/health_alarm_notify.conf && \
                      chmod 600 /etc/netdata/health_alarm_notify.conf"'

      - name: Deploy vps00
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /opt/stacks/vps00 && \
             if [ -n "$(docker compose config --services 2>/dev/null)" ]; then \
               docker compose pull && docker compose up -d && docker image prune -f && \
               docker compose restart netdata; \
             else \
               echo "no services defined, skipping compose pull/up"; \
             fi'

  deploy-vps01:
    needs: approve
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ vars.VPS01_SSH_PORT || 22 }}
      SSH_USER: ${{ vars.VPS01_SSH_USER || 'deploy' }}
      SSH_HOST: ${{ secrets.VPS01_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_VPS01 }}

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote stack dir
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/stacks/vps01'

      - name: Sync stack files
        run: |
          # backup/ holds the run log, the .last-success stamp the Netdata
          # age alarm reads, and the local archive: node state, not repo
          # state. --delete wiped it on every deploy until 2026-08-18.
          rsync -az --delete --exclude 'backup/' -e "ssh -p $SSH_PORT" \
            stacks/vps01/ "$SSH_USER@$SSH_HOST:/opt/stacks/vps01/"

      - name: Write remote .env
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS01_BOOKING }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
        run: |
          # One file, one write: this is 'cat >', not '>>', so every value
          # the stack needs has to be printed here or it is lost.
          printf 'CLOUDFLARE_TUNNEL_TOKEN_VPS01_BOOKING=%s\nNETDATA_CLAIM_TOKEN=%s\nNETDATA_CLAIM_ROOMS=%s\n' \
            "$TUNNEL_TOKEN" "$NETDATA_CLAIM_TOKEN" "$NETDATA_CLAIM_ROOMS" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.env'

      - name: Write remote health_alarm_notify.conf
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed \
            -e "s|__TELEGRAM_BOT_TOKEN__|$TELEGRAM_BOT_TOKEN|" \
            -e "s|__TELEGRAM_CHAT_ID__|$TELEGRAM_CHAT_ID|" \
            stacks/vps01/health_alarm_notify.conf.template | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'docker run --rm -i -v vps01_netdataconfig:/etc/netdata alpine:3.21 \
               sh -c "cat > /etc/netdata/health_alarm_notify.conf && \
                      chown 201:201 /etc/netdata/health_alarm_notify.conf && \
                      chmod 600 /etc/netdata/health_alarm_notify.conf"'

      - name: Write remote R2 backup credentials
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          printf 'RCLONE_CONFIG_R2_ACCESS_KEY_ID=%s\nRCLONE_CONFIG_R2_SECRET_ACCESS_KEY=%s\n' \
            "$R2_ACCESS_KEY_ID" "$R2_SECRET_ACCESS_KEY" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.r2.env'

      - name: Write remote Telegram credentials
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_CHAT_ID=%s\n' \
            "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_CHAT_ID" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps01/.telegram.env'

      - name: Install backup cron
        run: |
          # Debian's cron ignores CRON_TZ, so these fire hourly in the node's
          # own zone and backup-ezbookkeeping.sh gates itself on 03:00
          # Asia/Manila. Nothing here depends on the host clock's zone.
          #
          # Both entries go in one heredoc because 'crontab -' REPLACES the
          # whole crontab; installing a second job separately would delete
          # the first. See stacks/CLAUDE.md.
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/stacks/vps01/backup'
          {
            printf '0 * * * * /opt/stacks/vps01/backup-ezbookkeeping.sh'
            printf ' >> /opt/stacks/vps01/backup/backup.log 2>&1\n'
            printf '30 * * * * /opt/stacks/vps01/check-backup-age.sh'
            printf ' >> /opt/stacks/vps01/backup/check.log 2>&1\n'
          } | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'crontab -'

      - name: Deploy vps01
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /opt/stacks/vps01 && \
             if [ -n "$(docker compose config --services 2>/dev/null)" ]; then \
               docker compose pull && docker compose up -d && docker image prune -f && \
               docker compose restart netdata; \
             else \
               echo "no services defined, skipping compose pull/up"; \
             fi'

  deploy-vps02:
    needs: approve
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ vars.VPS02_SSH_PORT || 22 }}
      SSH_USER: ${{ vars.VPS02_SSH_USER || 'deploy' }}
      SSH_HOST: ${{ secrets.VPS02_HOST }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install SSH key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555  # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_VPS02 }}

      - name: Add known hosts
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ensure remote stack dir
        run: ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'mkdir -p /opt/stacks/vps02'

      - name: Sync stack files
        run: |
          rsync -az --delete -e "ssh -p $SSH_PORT" \
            stacks/vps02/ "$SSH_USER@$SSH_HOST:/opt/stacks/vps02/"

      - name: Write remote .env
        env:
          TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN_VPS02_METRICS }}
          NETDATA_CLAIM_TOKEN: ${{ secrets.NETDATA_CLAIM_TOKEN }}
          NETDATA_CLAIM_ROOMS: ${{ secrets.NETDATA_CLAIM_ROOMS }}
        run: |
          # One file, one write: this is 'cat >', not '>>', so every value
          # the stack needs has to be printed here or it is lost.
          printf 'CLOUDFLARE_TUNNEL_TOKEN_VPS02_METRICS=%s\nNETDATA_CLAIM_TOKEN=%s\nNETDATA_CLAIM_ROOMS=%s\n' \
            "$TUNNEL_TOKEN" "$NETDATA_CLAIM_TOKEN" "$NETDATA_CLAIM_ROOMS" | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'umask 077 && cat > /opt/stacks/vps02/.env'

      - name: Write remote health_alarm_notify.conf
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sed \
            -e "s|__TELEGRAM_BOT_TOKEN__|$TELEGRAM_BOT_TOKEN|" \
            -e "s|__TELEGRAM_CHAT_ID__|$TELEGRAM_CHAT_ID|" \
            stacks/vps02/health_alarm_notify.conf.template | \
            ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'docker run --rm -i -v vps02_netdataconfig:/etc/netdata alpine:3.21 \
               sh -c "cat > /etc/netdata/health_alarm_notify.conf && \
                      chown 201:201 /etc/netdata/health_alarm_notify.conf && \
                      chmod 600 /etc/netdata/health_alarm_notify.conf"'

      - name: Deploy vps02
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            'cd /opt/stacks/vps02 && \
             if [ -n "$(docker compose config --services 2>/dev/null)" ]; then \
               docker compose pull && docker compose up -d && docker image prune -f && \
               docker compose restart netdata; \
             else \
               echo "no services defined, skipping compose pull/up"; \
             fi'

  # Post-deploy health check. Parallel deploys mean a bad change reaches all
  # three nodes at once, so this is the thing that tells you, loudly, that
  # something is down. It only reports: it never tries to fix or roll back,
  # because a revert cannot undo node-side state and an automated retry loop
  # against three nodes with no human awake is worse than an alert.
  #
  # Runs even when a deploy job failed (but not when the run was cancelled),
  # so a partial failure still tells you which nodes are actually serving.
  #
  # Each probe goes through the public hostname, so a pass means the whole
  # path is alive: Cloudflare edge, the tunnel, cloudflared on the node, and
  # the origin service. The Netdata endpoints sit behind Cloudflare Access,
  # reached with the same service token the status Worker uses.
  verify:
    needs: [deploy-vps00, deploy-vps01, deploy-vps02]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Probe every node and app through its public hostname
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          fail=0
          probe() {
            name=$1
            url=$2
            want=$3
            shift 3
            got=$(curl -sS -o /dev/null -w '%{http_code}' -m 20 \
                    --retry 5 --retry-delay 5 --retry-all-errors \
                    "$@" "$url" || echo 000)
            if [ "$got" = "$want" ]; then
              echo "ok    $name ($got)"
            else
              echo "FAIL  $name: got $got, want $want"
              fail=1
            fi
          }

          for n in vps00 vps01 vps02; do
            probe "$n netdata" \
              "https://$n-metrics.maybeit.work/api/v1/data?chart=system.cpu&after=-60&points=1" \
              200 \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET"
          done

          probe "booking app" https://booking.maybeit.work/ 200
          probe "budget app" https://budget.maybeit.work/ 200
          # Access must still be in front of the dashboard: a 200 here would
          # mean the policy detached and the control plane is open.
          probe "dokploy behind Access" https://dokploy.maybeit.work/ 302

          exit $fail
