---
# Rail 1's enforcement point: the off-node port sweep, scheduled.
# check-rails.sh is source-level only; this actually probes the nodes
# from outside. Prints only "vps0N port N: OPEN/closed" — never an
# address (rail 5). Fails if any port but 22 answers, or if 22 does
# not (an unreachable node makes the sweep meaningless, so fail loud).
name: port sweep

"on":
  schedule:
    # Twice daily, ~12h apart, because GitHub queues scheduled runs
    # best-effort and drops them silently under load: 2026-08-27's
    # window never fired at all, and the three before it started 28min,
    # 28min and 2h50 late. Nothing fails when a run never starts, so one
    # cron line means rail 1's only real enforcement point can be dark
    # for a day with every run in the list still green. Two lines are not
    # a guarantee -- they are two chances a day for one to land.
    # 19:17 UTC = 03:17 Asia/Manila.
    - cron: "17 19 * * *"
    # 07:17 UTC = 15:17 Asia/Manila.
    - cron: "17 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS00: ${{ secrets.SSH_HOST_VPS00 }}
      VPS01: ${{ secrets.SSH_HOST_VPS01 }}
      VPS02: ${{ secrets.SSH_HOST_VPS02 }}
    steps:
      - name: Sweep all nodes
        run: |
          # /dev/tcp instead of nc: present on every runner, and immune
          # to the netcat-variant flag drift in the failure logs.
          fail=0
          for node in VPS00 VPS01 VPS02; do
            host="${!node}"
            if [ -z "$host" ]; then
              echo "$node: host secret is EMPTY"; fail=1; continue
            fi
            for port in 22 80 443 2377 3000 5080 8050 8101 8102 \
                        8150 8250 8251 19999 20241; do
              if timeout 3 bash -c "exec 3<>/dev/tcp/$host/$port" \
                  2>/dev/null; then
                state=OPEN
              else
                state=closed
              fi
              echo "$node port $port: $state"
              case "$port:$state" in
                22:closed) echo "$node: 22 unreachable"; fail=1 ;;
                22:OPEN) ;;
                *:OPEN) echo "$node: unexpected open port $port"; fail=1 ;;
              esac
            done
          done
          exit "$fail"
