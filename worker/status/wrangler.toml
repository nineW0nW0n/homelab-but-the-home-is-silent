name = "maybeit-status"
main = "src/index.js"
compatibility_date = "2026-08-15"

routes = [
  { pattern = "maybeit.work", custom_domain = true }
]

# Import src/page.html as a raw string -- served as-is at "/", no server
# templating needed (it fetches its own /status.json client-side).
[[rules]]
type = "Text"
globs = ["**/*.html"]

# Workers Logs, 7-day retention. Off until 2026-08-20, which is why the
# cloudflare-observability MCP returned an empty set for this Worker --
# absent config, not absent traffic. Workers created after the default
# flipped get this for free; maybeit-status predates it.
[observability]
enabled = true

# No KV binding and no vars: the poller retired 2026-09-03 (phoenixlab
# step 17). The Worker serves three static files and holds no state, no
# hostnames and no secrets.
