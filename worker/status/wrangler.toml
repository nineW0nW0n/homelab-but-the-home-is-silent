name = "maybeit-status"
main = "src/index.js"
compatibility_date = "2026-08-15"

routes = [
  { pattern = "maybeit.work", custom_domain = true }
]

# Import src/page.html as a raw string -- served as-is at "/", no server
# templating needed (it fetches its own /status.json client-side).
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Workers Logs, 7-day retention. Off until 2026-08-20, which is why the
# cloudflare-observability MCP returned an empty set for this Worker --
# absent config, not absent traffic. Workers created after the default
# flipped get this for free; maybeit-status predates it.
[observability]
enabled = true

[[kv_namespaces]]
binding = "STATUS_KV"
id = "8fbd60e3276e4a40a63609f9ed56e1fd"

[vars]
NODE_HOSTS = "vps00-metrics.maybeit.work,vps01-metrics.maybeit.work,vps02-metrics.maybeit.work"
# No DOKPLOY_HOST: the Worker deliberately does not poll Dokploy. See
# src/poll.js and CLAUDE.md -- sending this public Worker's Access service
# token to the deploy control plane bought an up/down flag only /debug showed.
