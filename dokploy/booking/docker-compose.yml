---
# EasyAppointments (booking.maybeit.work) on vps01.
#
# Deployed as the Dokploy Compose application `booking` (project prefix
# `booking-ptpwn8`), which pulls this path from the repo. The app predates
# the dokploy/ convention and lived only in Dokploy's own database until
# 2026-08-18; the provider was switched from Raw to GitHub rather than
# recreating the app, so the compose project name, and therefore the
# `booking-ptpwn8_mysql-data` volume holding the real appointment data,
# is untouched. Do not rename the Dokploy app: the volume name is derived
# from it, and a rename silently starts MySQL on an empty database.
#
# That data is small -- the volume is 203M on disk, but that is MySQL 8.0's
# own ibdata1, redo/undo tablespaces and binlogs, not appointments. Measured
# figures live in stacks/vps01/CLAUDE.md and are deliberately not restated
# here: this header carried a stale row count until 2026-08-20, the fifth
# site of a number that was wrong in four others. Small does not mean
# unimportant: it is real customer booking data.
#
# MYSQL_ROOT_PASSWORD and DB_PASSWORD come from Dokploy's environment tab
# (rail 11), never from this file.
services:
  easyappointments:
    image: alextselegidis/easyappointments:1.6.0
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    entrypoint:
      - sh
      - -c
      - |
        echo 'ServerName booking.maybeit.work' >> /etc/apache2/apache2.conf
        exec /usr/local/bin/docker-entrypoint.sh
    depends_on:
      - mysql
    environment:
      BASE_URL: https://booking.maybeit.work
      DEBUG_MODE: "FALSE"
      DB_HOST: mysql
      DB_NAME: easyappointments
      DB_USERNAME: easyappointments
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_PROTOCOL: mail
      MAIL_SMTP_DEBUG: "0"
      MAIL_SMTP_AUTH: "0"
      MAIL_SMTP_HOST: smtp.example.org
      MAIL_SMTP_USER: ""
      MAIL_SMTP_PASS: ""
      MAIL_SMTP_CRYPTO: tls
      MAIL_SMTP_PORT: "587"
      MAIL_FROM_ADDRESS: booking@maybeit.work
      MAIL_FROM_NAME: maybeit.work Booking
      MAIL_REPLY_TO_ADDRESS: booking@maybeit.work
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.booking-ptpwn8-10-web.rule=Host(`booking.maybeit.work`)
      - traefik.http.routers.booking-ptpwn8-10-web.entrypoints=web
      - traefik.http.services.booking-ptpwn8-10-web.loadbalancer.server.port=80
      - traefik.http.routers.booking-ptpwn8-10-web.service=booking-ptpwn8-10-web
      - traefik.enable=true
    networks:
      - dokploy-network
      - default
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    mem_limit: 640m
    mem_reservation: 320m
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: easyappointments
      MYSQL_USER: easyappointments
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
volumes:
  mysql-data: null
networks:
  dokploy-network:
    external: true
