# Alarm on the age of the last successful ezBookkeeping backup to R2.
# Fed by backup_age.plugin. Warn at 36h: the job runs daily at 03:00
# Asia/Manila, so 36h means a run was missed rather than merely late.
# Critical at 72h means three runs have gone by with no off-node copy.

    alarm: ezbookkeeping_backup_age
       on: backup_age.ezbookkeeping
    class: Errors
     type: System
component: Backup
     calc: $age
    units: hours
    every: 5m
     warn: $this > 36
     crit: $this > 72
# down 5m, not the stock-shaped 1h this started with. Netdata skips a
# notification when the last entry for this alarm that actually ran the
# notifier carries the SAME status, and that state survives restarts. The
# only thing that resets the chain is a CLEAR that executes -- so a long
# down delay is self-defeating here: every CLEAR was held an hour, the
# alarm re-fired first, and the alarm went permanently silent for CRITICAL
# while still looking armed. Long enough to damp a blip, short enough to
# actually execute. See stacks/CLAUDE.md.
#
# SUPERSEDED 2026-08-19, "that state survives restarts": measured, it also
# resets when the alarm's config_hash_id changes. Editing this file and
# redeploying moved the hash 046da83b -> 4686c70f at the 04:46:03Z netdata
# restart, with no transition recorded, and the wedge was already gone
# before the 10:01:03Z drill fired. So down 5m is not proven to be what
# broke the wedge; it is proven to let a CLEAR land before a re-fire
# supersedes it (10:11:03Z CLEAR executed at delay=300; under down 1h it
# would have been due at 11:11, after the 10:17 re-stale). Keep 5m for
# that reason, not as the credited fix.
    delay: down 5m multiplier 1.5 max 1h
     info: hours since the last ezBookkeeping backup was uploaded to R2
       to: sysadmin
