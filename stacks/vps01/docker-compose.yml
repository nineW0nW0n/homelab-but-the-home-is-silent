---
# vps01 stack. Deployed by .github/workflows/deploy.yml to
# /opt/stacks/vps01/docker-compose.yml.
#
# Own dedicated tunnel (CLOUDFLARE_TUNNEL_TOKEN_VPS01_BOOKING). Do NOT
# reuse vps00's shared CLOUDFLARE_TUNNEL_TOKEN. See infra note: one tunnel
# token = one interchangeable connector pool; sharing across nodes with
# different origins causes non-deterministic 502s (hit this once already).
#
# network_mode: host so the tunnel's Public Hostname routes
# (booking.maybeit.work -> http://localhost:8101, budget.maybeit.work ->
# http://localhost:8102, see stacks/CLAUDE.md) resolve to this VPS's own
# loopback, not the container's own network namespace. No reverse proxy:
# each app publishes its own loopback port.
services:
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-vps01
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN_VPS01_BOOKING}
    # Rail 4. Measured idle usage 2026-08-19: 27MiB (vps00), 29MiB
    # (vps01), 18MiB (vps02), so 64m is roughly 2x the busiest node.
    # Raise it if the tunnel is ever OOM-killed -- a too-tight limit
    # already caused one misdiagnosed kill here (scripts/CLAUDE.md).
    mem_limit: 64m
    mem_reservation: 32m

  netdata:
    image: netdata/netdata:v2.11.0
    container_name: netdata
    restart: unless-stopped
    network_mode: host
    environment:
      # Netdata Cloud claim. The same token goes on all three nodes on
      # purpose: unlike a tunnel token (rail 2) this identifies the Space,
      # not the node. Empty when the secret is unset, which is harmless —
      # an agent that is already claimed keeps its identity in the
      # netdatalib volume regardless. Claiming needs outbound HTTPS to
      # app.netdata.cloud only; it opens no inbound port (rail 1).
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: https://app.netdata.cloud
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /:/host/root:ro,rslave
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      # health_alarm_notify.conf is deliberately NOT bind-mounted: it is
      # written into the netdataconfig volume by deploy.yml as uid 201 so
      # the in-container netdata user can actually read it. See
      # stacks/CLAUDE.md, alerting section.
      - ./health.d/ram.conf:/etc/netdata/health.d/ram.conf:ro
      - ./health.d/disks.conf:/etc/netdata/health.d/disks.conf:ro
      - ./health.d/backup.conf:/etc/netdata/health.d/backup.conf:ro
      - ./backup_age.plugin:/usr/libexec/netdata/plugins.d/backup_age.plugin:ro
    mem_limit: 200m
    mem_reservation: 100m

  vector:
    # Ships this node's journal to OpenObserve on vps02 over vps02's
    # tunnel. Outbound HTTPS only (rail 1). Two locks on the way in:
    # the CF-Access service token headers and OpenObserve basic auth.
    # See stacks/vps02/vector.yaml for the config, kept identical here.
    image: timberio/vector:0.57.0-debian
    container_name: vector
    restart: unless-stopped
    network_mode: host
    environment:
      # Vector 0.57.0 turned config env-var interpolation OFF by
      # default; every ${...} in vector.yaml was passed through as a
      # literal string until this was set. The sink URI became a URI
      # containing spaces and braces -- "invalid uri character" --
      # and the credentials were the literal text of their own
      # placeholders. Upstream suggests the secrets backend instead;
      # that is a bigger change than this rollout wants today.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      NODE_NAME: vps01
      OPENOBSERVE_INGEST_URL: https://siem-ingest.maybeit.work
      OPENOBSERVE_INGEST_USER: ${OPENOBSERVE_INGEST_USER}
      OPENOBSERVE_INGEST_PASSWORD: ${OPENOBSERVE_INGEST_PASSWORD}
      CF_ACCESS_SIEM_CLIENT_ID: ${CF_ACCESS_SIEM_CLIENT_ID}
      CF_ACCESS_SIEM_CLIENT_SECRET: ${CF_ACCESS_SIEM_CLIENT_SECRET}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    mem_limit: 128m
    mem_reservation: 64m

  # booking.maybeit.work and budget.maybeit.work, adopted from Dokploy on
  # 2026-08-23. No reverse proxy: cloudflared dials each loopback port
  # directly. Port scheme 8NXX (N = node, 01-49 apps, 50-99 tools), see
  # docs/superpowers/specs/2026-08-23-dokploy-removal-design.md.
  # Container and volume names are frozen to Dokploy's: backup-booking.sh
  # and backup-ezbookkeeping.sh hardcode them.
  easyappointments:
    image: alextselegidis/easyappointments:1.6.0
    container_name: booking-ptpwn8-easyappointments-1
    restart: unless-stopped
    depends_on:
      - mysql
    entrypoint:
      - sh
      - -c
      - |
        echo 'ServerName booking.maybeit.work' >> /etc/apache2/apache2.conf
        exec /usr/local/bin/docker-entrypoint.sh
    environment:
      BASE_URL: https://booking.maybeit.work
      DEBUG_MODE: "FALSE"
      DB_HOST: mysql
      DB_NAME: easyappointments
      DB_USERNAME: easyappointments
      DB_PASSWORD: ${BOOKING_MYSQL_APP_PASSWORD}
      MAIL_PROTOCOL: mail
      MAIL_SMTP_DEBUG: "0"
      MAIL_SMTP_AUTH: "0"
      MAIL_SMTP_HOST: smtp.example.org
      MAIL_SMTP_USER: ""
      MAIL_SMTP_PASS: ""
      MAIL_SMTP_CRYPTO: tls
      MAIL_SMTP_PORT: "587"
      MAIL_FROM_ADDRESS: booking@maybeit.work
      MAIL_FROM_NAME: maybeit.work Booking
      MAIL_REPLY_TO_ADDRESS: booking@maybeit.work
    # Rail 1: loopback only. cloudflared runs network_mode: host, so
    # 127.0.0.1:8101 is reachable to it and to nothing off-node. The bind
    # address is written explicitly rather than relying on daemon.json's
    # default -- a config you authored is no proof the daemon honoured it.
    ports:
      - "127.0.0.1:8101:80"
    networks:
      - apps
    mem_limit: 256m
    mem_reservation: 128m

  mysql:
    image: mysql:8.0
    container_name: booking-ptpwn8-mysql-1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${BOOKING_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: easyappointments
      MYSQL_USER: easyappointments
      MYSQL_PASSWORD: ${BOOKING_MYSQL_APP_PASSWORD}
    volumes:
      - booking-mysql-data:/var/lib/mysql
    networks:
      - apps
    mem_limit: 640m
    mem_reservation: 320m

  ezbookkeeping:
    image: mayswind/ezbookkeeping:1.6.1
    container_name: ezbookkeeping
    restart: unless-stopped
    environment:
      EBK_SERVER_DOMAIN: budget.maybeit.work
      EBK_SERVER_ROOT_URL: https://budget.maybeit.work/
      EBK_SERVER_ENABLE_GZIP: "true"
      EBK_DATABASE_TYPE: sqlite3
      EBK_DATABASE_DB_PATH: /ezbookkeeping/data/ezbookkeeping.db
      EBK_LOG_MODE: console
      # Upload ceiling, not the usual size; stops a full-resolution phone
      # photo, receipts at 1080p land near 500 KB.
      EBK_USER_MAX_TRANSACTION_PICTURE_SIZE: "10485760"
      # Registration stays off. First account exists already.
      EBK_USER_ENABLE_REGISTER: "false"
      # 32+ random chars. Changing it invalidates every session.
      EBK_SECURITY_SECRET_KEY: ${BUDGET_SECRET_KEY}
    volumes:
      - ezbookkeeping-data:/ezbookkeeping/data
      - ezbookkeeping-storage:/ezbookkeeping/storage
      - /etc/localtime:/etc/localtime:ro
    # Rail 1: loopback only, same reasoning as easyappointments above.
    ports:
      - "127.0.0.1:8102:8080"
    networks:
      - apps
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    mem_reservation: 128m

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  vector-data:
  # Adopted, not created. The names are Dokploy's and are deliberately
  # frozen: backup-booking.sh and backup-ezbookkeeping.sh hardcode them,
  # and a rename starts MySQL on an empty database (stacks/vps01/CLAUDE.md).
  # external: true makes Compose refuse to run rather than silently create
  # an empty volume if the name is ever wrong.
  booking-mysql-data:
    external: true
    name: booking-ptpwn8_mysql-data
  ezbookkeeping-data:
    external: true
    name: vps01booking-ezbookkeeping-rqdyxo_data
  ezbookkeeping-storage:
    external: true
    name: vps01booking-ezbookkeeping-rqdyxo_storage

networks:
  apps:
