---
# vps02 stack. Deployed by .github/workflows/deploy.yml to
# /opt/stacks/vps02/docker-compose.yml.
#
# Netdata is this node's first workload. It gets its own dedicated
# tunnel + token (CLOUDFLARE_TUNNEL_TOKEN_VPS02_METRICS), never vps00's
# shared CLOUDFLARE_TUNNEL_TOKEN (see stacks/CLAUDE.md, rail 2: a
# shared token load-balances requests across nodes with different
# origins and 502s).
#
# network_mode: host so localhost:8250 in the tunnel's Public Hostname
# route resolves to this VPS's own Netdata, not the container's netns.
services:
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-vps02
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN_VPS02_METRICS}
    # Rail 4. Measured idle usage 2026-08-19: 27MiB (vps00), 29MiB
    # (vps01), 18MiB (vps02), so 64m is roughly 2x the busiest node.
    # Raise it if the tunnel is ever OOM-killed -- a too-tight limit
    # already caused one misdiagnosed kill here (scripts/CLAUDE.md).
    mem_limit: 64m
    mem_reservation: 32m

  netdata:
    image: netdata/netdata:v2.11.0
    container_name: netdata
    # Image's baked-in healthcheck curls 19999; port moved 2026-08-24 (port
    # scheme). Override with the real per-node port or Docker flags the
    # container unhealthy forever.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8250/api/v1/info"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    network_mode: host
    environment:
      # Netdata Cloud claim. The same token goes on all three nodes on
      # purpose: unlike a tunnel token (rail 2) this identifies the Space,
      # not the node. Empty when the secret is unset, which is harmless —
      # an agent that is already claimed keeps its identity in the
      # netdatalib volume regardless. Claiming needs outbound HTTPS to
      # app.netdata.cloud only; it opens no inbound port (rail 1).
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: https://app.netdata.cloud
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /:/host/root:ro,rslave
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      # health_alarm_notify.conf is deliberately NOT bind-mounted: it is
      # written into the netdataconfig volume by deploy.yml as uid 201 so
      # the in-container netdata user can actually read it. See
      # stacks/CLAUDE.md, alerting section.
      - ./health.d/ram.conf:/etc/netdata/health.d/ram.conf:ro
      - ./health.d/disks.conf:/etc/netdata/health.d/disks.conf:ro
    mem_limit: 256m
    mem_reservation: 128m

  openobserve:
    # Log store + UI. Single binary, local Parquet under /data. Reached
    # only via vps02's tunnel: siem.maybeit.work (UI, Access email
    # policy) and siem-ingest.maybeit.work (Vector on vps00/vps01,
    # Access service token). Spec:
    # docs/superpowers/specs/2026-08-22-siem-openobserve-design.md
    image: openobserve/openobserve:v0.92.2
    container_name: openobserve
    restart: unless-stopped
    ports:
      # Loopback explicitly (rail 1), on top of daemon.json's default
      # bind. Belt and braces: a daemon.json regression must not open it.
      - "127.0.0.1:8251:5080"
    environment:
      ZO_ROOT_USER_EMAIL: ${OPENOBSERVE_ROOT_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_ROOT_PASSWORD}
      ZO_DATA_DIR: /data
      ZO_COMPACT_DATA_RETENTION_DAYS: "30"
      ZO_TELEMETRY: "false"
      # MB. Default sizes the cache from host RAM, not the cgroup limit;
      # hedged, raise if queries feel slow and the container stays well
      # under mem_limit.
      ZO_MEMORY_CACHE_MAX_SIZE: "64"
    volumes:
      - openobserve-data:/data
    # Rail 4. Measured 2026-08-23 after ~50 min of real ingest from three
    # nodes: 338-343 MiB steady across three samples, which was 89% of the
    # old 384m cap. Raised for headroom, not because it was growing -- 43
    # MiB spare leaves nothing for a compaction or a wide query, and an
    # OOM kill just restarts the container and loses the WAL quietly.
    mem_limit: 512m
    mem_reservation: 256m

  vector:
    # Ships this node's journal to OpenObserve. See vector.yaml.
    image: timberio/vector:0.57.0-debian
    container_name: vector
    restart: unless-stopped
    # Host netns so 127.0.0.1:8251 is the OpenObserve port above.
    network_mode: host
    # Start order only (no healthcheck): on a cold boot Vector would
    # otherwise post to a port nothing listens on yet, and every refused
    # batch logs an error that the journald log driver feeds back in.
    depends_on: [openobserve]
    environment:
      # Vector 0.57.0 turned config env-var interpolation OFF by
      # default; every ${...} in vector.yaml was passed through as a
      # literal string until this was set. The sink URI became a URI
      # containing spaces and braces -- "invalid uri character" --
      # and the credentials were the literal text of their own
      # placeholders. Upstream suggests the secrets backend instead;
      # that is a bigger change than this rollout wants today.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      NODE_NAME: vps02
      OPENOBSERVE_INGEST_URL: http://127.0.0.1:8251
      OPENOBSERVE_INGEST_USER: ${OPENOBSERVE_INGEST_USER}
      OPENOBSERVE_INGEST_PASSWORD: ${OPENOBSERVE_INGEST_PASSWORD}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    mem_limit: 128m
    mem_reservation: 64m

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  openobserve-data:
  vector-data:
