---
# vps02 stack. Deployed by .github/workflows/deploy.yml to
# /opt/stacks/vps02/docker-compose.yml.
#
# No cloudflared here. All 3 nodes shared one CLOUDFLARE_TUNNEL_TOKEN,
# which made Cloudflare load-balance dokploy.maybeit.work requests across
# every node's connector — vps01/vps02 have nothing on the origin port,
# so ~2/3 of requests 502'd. A shared tunnel token only works if every
# connector node serves the same origins.
#
# When vps02 gets a real workload with its own public hostname: either
# create a separate tunnel + token for this node, or add its port here
# and give it its own Public Hostname route pointing at this node
# specifically (not the shared vps00 tunnel).
#
# deploy.yml's vps02 job writes no .env — there's no dedicated token to
# write yet. Adding a cloudflared service here means adding a new
# CLOUDFLARE_TUNNEL_TOKEN_VPS02_* secret + a "Write remote .env" step in
# deploy.yml, same pattern as vps01. Do NOT reuse CLOUDFLARE_TUNNEL_TOKEN
# (vps00's) — see stacks/CLAUDE.md failure log.
services: {}
