[global]
    update every = 5
    memory mode = dbengine

[db]
    mode = dbengine
    storage tiers = 1
    dbengine tier 0 retention size = 0
    dbengine tier 0 retention time = 7d

[ml]
    enabled = no

[web]
    # 8N50: the port scheme's tools band (8NXX, N = node, 50-99 tools).
    # One port per node so a mixed-up tunnel route fails with
    # connection-refused instead of serving the wrong node's metrics
    # (rail 2's original incident). Was 19999 until 2026-08-24.
    default port = 8250
    bind to = 127.0.0.1

[plugins]
    apps = no
    ebpf = no
    # Metrics only. Logs are OpenObserve's job (stacks/<node>/vector.yaml);
    # the journal plugins duplicated that at ~100 MiB of a 2 GB node, and
    # the three receivers below had nothing sending to them. Accepted cost:
    # no dashboard view of a node's logs while OpenObserve is down.
    systemd-journal = no
    systemd-units = no
    # Receivers: otel 127.0.0.1:4317, statsd 127.0.0.1:8125, netflow
    # 0.0.0.0:2055/6343 UDP. netdata is network_mode: host, so the
    # daemon.json loopback default never applied to it; UFW was the only
    # thing in front of netflow.
    otel = no
    statsd = no
    netflow = no
