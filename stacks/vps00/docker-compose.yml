---
# vps00 stack. Deployed by .github/workflows/deploy.yml to
# /opt/stacks/vps00/docker-compose.yml. Node-specific workload
# services go here in addition to cloudflared.
#
# cloudflared runs on network_mode: host so tunnel origin URLs like
# http://localhost:8050 resolve to the VPS itself, not the container's
# own network namespace (bridge mode caused 502s reaching the origin).
services:
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-vps00
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Rail 4. Measured idle usage 2026-08-19: 27MiB (vps00), 29MiB
    # (vps01), 18MiB (vps02), so 64m is roughly 2x the busiest node.
    # Raise it if the tunnel is ever OOM-killed -- a too-tight limit
    # already caused one misdiagnosed kill here (scripts/CLAUDE.md).
    mem_limit: 64m
    mem_reservation: 32m

  netdata:
    image: netdata/netdata:v2.11.0
    container_name: netdata
    # Image's baked-in healthcheck curls 19999; port moved 2026-08-24 (port
    # scheme). Override with the real per-node port or Docker flags the
    # container unhealthy forever.
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8050/api/v1/info"]
      interval: 60s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    network_mode: host
    environment:
      # Netdata Cloud claim. The same token goes on all three nodes on
      # purpose: unlike a tunnel token (rail 2) this identifies the Space,
      # not the node. Empty when the secret is unset, which is harmless —
      # an agent that is already claimed keeps its identity in the
      # netdatalib volume regardless. Claiming needs outbound HTTPS to
      # app.netdata.cloud only; it opens no inbound port (rail 1).
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: https://app.netdata.cloud
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /:/host/root:ro,rslave
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      # health_alarm_notify.conf is deliberately NOT bind-mounted: it is
      # written into the netdataconfig volume by deploy.yml as uid 201 so
      # the in-container netdata user can actually read it. See
      # stacks/CLAUDE.md, alerting section.
      - ./health.d/ram.conf:/etc/netdata/health.d/ram.conf:ro
      - ./health.d/disks.conf:/etc/netdata/health.d/disks.conf:ro
    mem_limit: 256m
    mem_reservation: 128m

  vector:
    # Ships this node's journal to OpenObserve on vps02 over vps02's
    # tunnel. Outbound HTTPS only (rail 1). Two locks on the way in:
    # the CF-Access service token headers and OpenObserve basic auth.
    # See stacks/vps02/vector.yaml for the config, kept identical here.
    image: timberio/vector:0.57.0-debian
    container_name: vector
    restart: unless-stopped
    network_mode: host
    environment:
      # Vector 0.57.0 turned config env-var interpolation OFF by
      # default; every ${...} in vector.yaml was passed through as a
      # literal string until this was set. The sink URI became a URI
      # containing spaces and braces -- "invalid uri character" --
      # and the credentials were the literal text of their own
      # placeholders. Upstream suggests the secrets backend instead;
      # that is a bigger change than this rollout wants today.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      NODE_NAME: vps00
      OPENOBSERVE_INGEST_URL: https://siem-ingest.maybeit.work
      OPENOBSERVE_INGEST_USER: ${OPENOBSERVE_INGEST_USER}
      OPENOBSERVE_INGEST_PASSWORD: ${OPENOBSERVE_INGEST_PASSWORD}
      CF_ACCESS_SIEM_CLIENT_ID: ${CF_ACCESS_SIEM_CLIENT_ID}
      CF_ACCESS_SIEM_CLIENT_SECRET: ${CF_ACCESS_SIEM_CLIENT_SECRET}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    mem_limit: 128m
    mem_reservation: 64m

  # wiki-kit (nineW0nW0n/wiki-kit): private wiki serving the brain-work
  # bundle at wiki.maybeit.work, behind Access (owner-only). Three
  # services from the upstream compose file, minus its cloudflared
  # (vps00's host-mode one dials 127.0.0.1:8001 instead, rails 2/3) and
  # minus its runner (mounts docker.sock — banned on these nodes). These
  # three run on the default bridge network: wiki-web dials wiki-mcp by
  # service name, and only wiki-web publishes a port, loopback-only
  # (rail 1). bundles.yml and Caddyfile ship with this stack via rsync.
  wiki-builder:
    image: ghcr.io/ninew0nw0n/wiki-kit:0.1.2
    container_name: wiki-builder
    restart: unless-stopped
    environment:
      # Fine-grained PAT, read-only Contents on brain-work only.
      GIT_TOKEN: ${WIKI_GIT_TOKEN}
    volumes:
      - ./bundles.yml:/etc/wiki/bundles.yml:ro
      - wiki-bundles:/bundles
      - wiki-site:/site
      - wiki-state:/state
    # Rail 4, measured 2026-08-29: cgroup memory.peak over a window
    # containing a real Quartz build was 344 MiB (idle poll ~19 MiB).
    # 512m is that peak + ~50%, matching every other cap here. Read the
    # peak, not docker stats -- interval_seconds is 900, so a snapshot
    # almost always catches the idle poll. See issue #82.
    mem_limit: 512m
    mem_reservation: 256m

  wiki-web:
    image: caddy:2.11.4-alpine
    container_name: wiki-web
    restart: unless-stopped
    ports:
      # :8090 is the tunnel listener (Access headers trusted); the
      # image's :8080 LAN listener stays unpublished.
      - "127.0.0.1:8001:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - wiki-bundles:/bundles:ro
      - wiki-site:/site:ro
      - wiki-state:/state:ro
    mem_limit: 64m
    mem_reservation: 32m

  wiki-mcp:
    image: ghcr.io/ninew0nw0n/wiki-kit:0.1.2
    container_name: wiki-mcp
    restart: unless-stopped
    command: ["python3", "mcp/server.py"]
    volumes:
      - ./bundles.yml:/etc/wiki/bundles.yml:ro
      - wiki-bundles:/bundles:ro
      - wiki-state:/state:ro
    mem_limit: 128m
    mem_reservation: 64m

  # google-workspace-mcp (taylorwilsdon/google_workspace_mcp): Gmail,
  # Calendar, Drive, Docs, Sheets and the rest of Workspace as MCP tools,
  # for Claude Code on the laptop. vps00 is the MCP node (this directory's
  # CLAUDE.md), so it lands here next to wiki-mcp.
  #
  # Legacy streamable-http mode has NO MCP-level auth of its own: the only
  # locks are this loopback-only publish (rail 1) and the Cloudflare Access
  # app in front of the tunnel route. Same trust as wiki-mcp's :8090
  # listener -- a node-local process could reach it directly.
  gws-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.25.2
    container_name: gws-mcp
    restart: unless-stopped
    # One string, not a word list: the image's ENTRYPOINT is
    # ["/bin/sh", "-c"], so a multi-item command would arrive as separate
    # sh arguments and only the first would run.
    command: ["uv run main.py --transport streamable-http --single-user --tool-tier complete"]
    ports:
      # 8N51, tools range (stacks/CLAUDE.md). Container-side 8000.
      - "127.0.0.1:8051:8000"
    environment:
      # Verified in main.py@1.25.2 (resolve_bind_host_for_transport):
      # legacy streamable-http binds 127.0.0.1 INSIDE the container unless
      # this is set, and docker-proxy dials the container IP, not its
      # loopback -- so without it the published port answers nothing. The
      # host side stays 127.0.0.1 above; rail 1 is unaffected.
      WORKSPACE_MCP_HOST: 0.0.0.0
      # Google redirects the browser here after consent, so it must be the
      # public HTTPS hostname, and it must match the Authorized redirect
      # URI on the OAuth client exactly. WORKSPACE_EXTERNAL_URL is the
      # reverse-proxy escape hatch: without it the server advertises
      # base_uri + ":" + port, i.e. a URL with a port in it.
      WORKSPACE_EXTERNAL_URL: https://gws.maybeit.work
      GOOGLE_OAUTH_REDIRECT_URI: https://gws.maybeit.work/oauth2callback
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # --single-user: every tool call uses this account, no per-call
      # email argument and no second user's grant to confuse it with.
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL}
      WORKSPACE_MCP_CREDENTIALS_DIR: /app/store_creds
    volumes:
      # The Google refresh token lives here. Losing this volume means
      # re-running the consent flow, nothing worse.
      - gws-mcp-creds:/app/store_creds
    # Rail 4, NOT yet measured -- an estimate for a Python/FastMCP process
    # with the complete tool tier loaded, hedged on purpose. Replace it
    # with cgroup memory.peak + ~50% after a few days of real use, the way
    # wiki-builder's cap was fixed (issue #82). Committed total on this
    # node stays under 1.6 GB of the 2 GB, and there is no swap.
    mem_limit: 384m
    mem_reservation: 192m

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  vector-data:
  wiki-bundles:
  wiki-site:
  wiki-state:
  gws-mcp-creds:
