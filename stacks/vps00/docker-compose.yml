---
# vps00 stack. Deployed by .github/workflows/deploy.yml to
# /opt/stacks/vps00/docker-compose.yml. Node-specific workload
# services go here in addition to cloudflared.
#
# cloudflared runs on network_mode: host so tunnel origin URLs like
# http://localhost:8050 resolve to the VPS itself, not the container's
# own network namespace (bridge mode caused 502s reaching the origin).
services:
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-vps00
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Rail 4. Measured idle usage 2026-08-19: 27MiB (vps00), 29MiB
    # (vps01), 18MiB (vps02), so 64m is roughly 2x the busiest node.
    # Raise it if the tunnel is ever OOM-killed -- a too-tight limit
    # already caused one misdiagnosed kill here (scripts/CLAUDE.md).
    mem_limit: 64m
    mem_reservation: 32m

  vector:
    # Ships this node's journal to OpenObserve on vps02 over vps02's
    # tunnel. Outbound HTTPS only (rail 1). Two locks on the way in:
    # the CF-Access service token headers and OpenObserve basic auth.
    # See stacks/vps02/vector.yaml for the config, kept identical here.
    image: timberio/vector:0.57.0-debian
    container_name: vector
    restart: unless-stopped
    network_mode: host
    environment:
      # Vector 0.57.0 turned config env-var interpolation OFF by
      # default; every ${...} in vector.yaml was passed through as a
      # literal string until this was set. The sink URI became a URI
      # containing spaces and braces -- "invalid uri character" --
      # and the credentials were the literal text of their own
      # placeholders. Upstream suggests the secrets backend instead;
      # that is a bigger change than this rollout wants today.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      NODE_NAME: vps00
      OPENOBSERVE_INGEST_URL: https://siem-ingest.maybeit.work
      OPENOBSERVE_INGEST_USER: ${OPENOBSERVE_INGEST_USER}
      OPENOBSERVE_INGEST_PASSWORD: ${OPENOBSERVE_INGEST_PASSWORD}
      CF_ACCESS_SIEM_CLIENT_ID: ${CF_ACCESS_SIEM_CLIENT_ID}
      CF_ACCESS_SIEM_CLIENT_SECRET: ${CF_ACCESS_SIEM_CLIENT_SECRET}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    mem_limit: 128m
    mem_reservation: 64m

  # wiki-kit (nineW0nW0n/wiki-kit): private wiki serving the brain-work
  # bundle at wiki.maybeit.work, behind Access (owner-only). Three
  # services from the upstream compose file, minus its cloudflared
  # (vps00's host-mode one dials 127.0.0.1:8001 instead, rails 2/3) and
  # minus its runner (mounts docker.sock — banned on these nodes). These
  # three run on the default bridge network: wiki-web dials wiki-mcp by
  # service name, and only wiki-web publishes a port, loopback-only
  # (rail 1). bundles.yml and Caddyfile ship with this stack via rsync.
  wiki-builder:
    image: ghcr.io/ninew0nw0n/wiki-kit:0.1.2
    container_name: wiki-builder
    restart: unless-stopped
    environment:
      # Fine-grained PAT, read-only Contents on brain-work only.
      GIT_TOKEN: ${WIKI_GIT_TOKEN}
    volumes:
      - ./bundles.yml:/etc/wiki/bundles.yml:ro
      - wiki-bundles:/bundles
      - wiki-site:/site
      - wiki-state:/state
    # Rail 4, measured 2026-08-29: cgroup memory.peak over a window
    # containing a real Quartz build was 344 MiB (idle poll ~19 MiB).
    # 512m is that peak + ~50%, matching every other cap here. Read the
    # peak, not docker stats -- interval_seconds is 900, so a snapshot
    # almost always catches the idle poll. See issue #82.
    mem_limit: 512m
    mem_reservation: 256m

  wiki-web:
    image: caddy:2.11.4-alpine
    container_name: wiki-web
    restart: unless-stopped
    ports:
      # :8090 is the tunnel listener (Access headers trusted); the
      # image's :8080 LAN listener stays unpublished.
      - "127.0.0.1:8001:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - wiki-bundles:/bundles:ro
      - wiki-site:/site:ro
      - wiki-state:/state:ro
    mem_limit: 64m
    mem_reservation: 32m

  wiki-mcp:
    image: ghcr.io/ninew0nw0n/wiki-kit:0.1.2
    container_name: wiki-mcp
    restart: unless-stopped
    command: ["python3", "mcp/server.py"]
    volumes:
      - ./bundles.yml:/etc/wiki/bundles.yml:ro
      - wiki-bundles:/bundles:ro
      - wiki-state:/state:ro
    mem_limit: 128m
    mem_reservation: 64m

  # google-workspace-mcp (taylorwilsdon/google_workspace_mcp): Gmail,
  # Calendar, Drive, Docs, Sheets and the rest of Workspace as MCP tools,
  # for Claude Code on the laptop. vps00 is the MCP node (this directory's
  # CLAUDE.md), so it lands here next to wiki-mcp.
  #
  # Legacy streamable-http mode has NO MCP-level auth of its own: the only
  # locks are this loopback-only publish (rail 1) and the Cloudflare Access
  # app in front of the tunnel route. Same trust as wiki-mcp's :8090
  # listener -- a node-local process could reach it directly.
  gws-mcp:
    image: ghcr.io/taylorwilsdon/google_workspace_mcp:1.25.2
    container_name: gws-mcp
    restart: unless-stopped
    # One string, not a word list: the image's ENTRYPOINT is
    # ["/bin/sh", "-c"], so a multi-item command would arrive as separate
    # sh arguments and only the first would run.
    command: ["uv run main.py --transport streamable-http --single-user --tool-tier complete"]
    ports:
      # 8N51, tools range (stacks/CLAUDE.md). Container-side 8000.
      - "127.0.0.1:8051:8000"
    environment:
      # Verified in main.py@1.25.2 (resolve_bind_host_for_transport):
      # legacy streamable-http binds 127.0.0.1 INSIDE the container unless
      # this is set, and docker-proxy dials the container IP, not its
      # loopback -- so without it the published port answers nothing. The
      # host side stays 127.0.0.1 above; rail 1 is unaffected.
      WORKSPACE_MCP_HOST: 0.0.0.0
      # Google redirects the browser here after consent, so it must be the
      # public HTTPS hostname, and it must match the Authorized redirect
      # URI on the OAuth client exactly. WORKSPACE_EXTERNAL_URL is the
      # reverse-proxy escape hatch: without it the server advertises
      # base_uri + ":" + port, i.e. a URL with a port in it.
      WORKSPACE_EXTERNAL_URL: https://gws.maybeit.work
      GOOGLE_OAUTH_REDIRECT_URI: https://gws.maybeit.work/oauth2callback
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      # The default account, not the only one. Verified in
      # core/server.py@1.25.2: this variable makes the server drop
      # user_google_email from every tool's required list and inject
      # this value only when the caller omits the argument. A caller
      # that passes a different address is left alone, and
      # auth/google_auth.py's single-user path then loads that
      # address's own credential file from the volume below -- with no
      # fallback to this one. --single-user skips FastMCP session
      # mapping; it does not pin calls to one account. Three grants live
      # here since 2026-08-29 (abcollado.28, excollado,
      # feeder.kantooter), one file each.
      USER_GOOGLE_EMAIL: ${USER_GOOGLE_EMAIL}
      WORKSPACE_MCP_CREDENTIALS_DIR: /app/store_creds
    volumes:
      # The Google refresh token lives here. Losing this volume means
      # re-running the consent flow, nothing worse.
      - gws-mcp-creds:/app/store_creds
    # Rail 4, re-measured 2026-08-29 after real traffic (issue #88):
    # cgroup memory.peak 354 MiB over a 6.4h window carrying the whole
    # first inbox reorganisation -- 125 search_gmail_messages, 121
    # manage_gmail_label, 61 batch_modify_gmail_message_labels -- against
    # 347 MiB measured before any grant or tool call existed. Real work
    # moved the peak 7 MiB: the startup import of the complete tool tier
    # dominates, and per-call payloads do not come close. 512m is kept,
    # not recomputed: peak + 50% would be 531m, and trimming 158 MiB of
    # headroom to chase 19m is not worth a redeploy. Steady state 235 MiB
    # (docker stats), RestartCount 0, OOMKilled false.
    # Still unexercised: get_gmail_threads_content_batch, which pulls 25
    # thread bodies at once and is the heaviest tool here. If that becomes
    # routine, read the peak again.
    # Committed total on this node is 1792m of 2 GB, plus 2 GB swap.
    mem_limit: 512m
    mem_reservation: 256m

  # Beszel agent: the hub on the Ashes node connects IN over SSH on
  # tcp/45876 and pulls host CPU/memory/disk. The agent never dials out.
  # HUB_URL/TOKEN would select the agent-dials-hub WebSocket path, and
  # these nodes report source country US, which the zone firewall blocks
  # ahead of Access -- an outbound agent would fail and read as an auth
  # error. The hub dials in instead (phoenixlab ADR 0005). Replaced
  # Netdata's metrics role when it retired 2026-09-04 (phoenixlab step 17).
  #
  # Rail 1: network_mode: host is load-bearing here, not cosmetic. A
  # host-netns listener never traverses FORWARD, so DOCKER-USER and
  # daemon.json's loopback bind do not apply to it -- ufw INPUT is the
  # only layer in front, and harden-node.sh's `ufw default deny incoming`
  # keeps 45876 shut until a source-restricted `ufw allow from <hub> to
  # any port 45876 proto tcp` is added by hand on each node (never
  # committed: rail 5). Converting this to bridge + ports: would move the
  # traffic to a chain that rule does not govern, silently.
  #
  # No docker.sock, same reason as vector (stacks/CLAUDE.md):
  # a :ro bind on it is still host root. Host-level CPU/memory/disk is all
  # that is wanted. No healthcheck either -- measured on 0.18.8, the
  # vendor's `/agent health` prints ok and exits 0 from a container with
  # nothing running and with LISTEN pointing at a dead socket, so it would
  # put a green light over a dead agent. The image is distroless, so there
  # is no shell probe to fall back on.
  beszel-agent:
    image: henrygd/beszel-agent:0.18.8
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
    environment:
      LISTEN: "45876"
      # The hub's SSH public key. Public half only, not secret material.
      KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBhsAA+enUy8mR7+/mwhctM3PKNw9awWtIwhxLsfTBnU"
    # Rail 4. Measured, not guessed: the same image on the hub's own node
    # used 11.85 MiB resident after 30 minutes -- and that one mounts the
    # Docker socket, which these three deliberately do not, so they collect
    # less. 128m is ~10x headroom; the cap exists to stop one service taking
    # the node, not to make it slow. Re-read docker stats after a week even
    # so: that figure came from a different host, not from these.
    mem_limit: 128m
    mem_reservation: 32m

volumes:
  vector-data:
  wiki-bundles:
  wiki-site:
  wiki-state:
  gws-mcp-creds:
  beszel-agent-data:
