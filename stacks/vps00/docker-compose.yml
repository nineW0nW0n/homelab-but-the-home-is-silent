---
# vps00 stack. Deployed by .github/workflows/deploy.yml to
# /opt/stacks/vps00/docker-compose.yml. Node-specific workload
# services go here in addition to cloudflared.
#
# cloudflared runs on network_mode: host so tunnel origin URLs like
# http://localhost:3000 resolve to the VPS itself, not the container's
# own network namespace (bridge mode caused 502s reaching Dokploy).
services:
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-vps00
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
