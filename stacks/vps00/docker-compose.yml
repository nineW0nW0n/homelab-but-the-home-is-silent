---
# vps00 stack. Deployed by .github/workflows/deploy.yml to
# /opt/stacks/vps00/docker-compose.yml. Node-specific workload
# services go here in addition to cloudflared.
#
# cloudflared runs on network_mode: host so tunnel origin URLs like
# http://localhost:8050 resolve to the VPS itself, not the container's
# own network namespace (bridge mode caused 502s reaching the origin).
services:
  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: cloudflared-vps00
    restart: unless-stopped
    network_mode: host
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    # Rail 4. Measured idle usage 2026-08-19: 27MiB (vps00), 29MiB
    # (vps01), 18MiB (vps02), so 64m is roughly 2x the busiest node.
    # Raise it if the tunnel is ever OOM-killed -- a too-tight limit
    # already caused one misdiagnosed kill here (scripts/CLAUDE.md).
    mem_limit: 64m
    mem_reservation: 32m

  netdata:
    image: netdata/netdata:v2.11.0
    container_name: netdata
    restart: unless-stopped
    network_mode: host
    environment:
      # Netdata Cloud claim. The same token goes on all three nodes on
      # purpose: unlike a tunnel token (rail 2) this identifies the Space,
      # not the node. Empty when the secret is unset, which is harmless —
      # an agent that is already claimed keeps its identity in the
      # netdatalib volume regardless. Claiming needs outbound HTTPS to
      # app.netdata.cloud only; it opens no inbound port (rail 1).
      NETDATA_CLAIM_TOKEN: ${NETDATA_CLAIM_TOKEN:-}
      NETDATA_CLAIM_URL: https://app.netdata.cloud
      NETDATA_CLAIM_ROOMS: ${NETDATA_CLAIM_ROOMS:-}
    volumes:
      - netdataconfig:/etc/netdata
      - netdatalib:/var/lib/netdata
      - netdatacache:/var/cache/netdata
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /:/host/root:ro,rslave
      - ./netdata.conf:/etc/netdata/netdata.conf:ro
      # health_alarm_notify.conf is deliberately NOT bind-mounted: it is
      # written into the netdataconfig volume by deploy.yml as uid 201 so
      # the in-container netdata user can actually read it. See
      # stacks/CLAUDE.md, alerting section.
      - ./health.d/ram.conf:/etc/netdata/health.d/ram.conf:ro
      - ./health.d/disks.conf:/etc/netdata/health.d/disks.conf:ro
    mem_limit: 200m
    mem_reservation: 100m

  vector:
    # Ships this node's journal to OpenObserve on vps02 over vps02's
    # tunnel. Outbound HTTPS only (rail 1). Two locks on the way in:
    # the CF-Access service token headers and OpenObserve basic auth.
    # See stacks/vps02/vector.yaml for the config, kept identical here.
    image: timberio/vector:0.57.0-debian
    container_name: vector
    restart: unless-stopped
    network_mode: host
    environment:
      # Vector 0.57.0 turned config env-var interpolation OFF by
      # default; every ${...} in vector.yaml was passed through as a
      # literal string until this was set. The sink URI became a URI
      # containing spaces and braces -- "invalid uri character" --
      # and the credentials were the literal text of their own
      # placeholders. Upstream suggests the secrets backend instead;
      # that is a bigger change than this rollout wants today.
      VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION: "true"
      NODE_NAME: vps00
      OPENOBSERVE_INGEST_URL: https://siem-ingest.maybeit.work
      OPENOBSERVE_INGEST_USER: ${OPENOBSERVE_INGEST_USER}
      OPENOBSERVE_INGEST_PASSWORD: ${OPENOBSERVE_INGEST_PASSWORD}
      CF_ACCESS_SIEM_CLIENT_ID: ${CF_ACCESS_SIEM_CLIENT_ID}
      CF_ACCESS_SIEM_CLIENT_SECRET: ${CF_ACCESS_SIEM_CLIENT_SECRET}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      - vector-data:/var/lib/vector
      - /var/log/journal:/var/log/journal:ro
      - /run/log/journal:/run/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    mem_limit: 128m
    mem_reservation: 64m

volumes:
  netdataconfig:
  netdatalib:
  netdatacache:
  vector-data:
