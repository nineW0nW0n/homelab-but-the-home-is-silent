---
# Extends infra/common/base.yaml. IP resolved at deploy time from
# infra/inventory.yaml (gitignored) or VPS01_HOST secret — never hardcoded.
node:
  name: vps01
  hostname: vps01.maybeit.work
  role: secondary
  inventory_ref: nodes.vps01

ssh:
  user: deploy
  port: 22
  host_var: VPS01_HOST

dokploy:
  register: true
  labels:
    - secondary

workloads: []
