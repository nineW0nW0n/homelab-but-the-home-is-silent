---
# Extends infra/common/base.yaml. IP resolved at deploy time from
# infra/inventory.yaml (gitignored) or VPS00_HOST secret — never hardcoded.
node:
  name: vps00
  hostname: vps00.maybeit.work
  role: primary
  inventory_ref: nodes.vps00

ssh:
  user: deploy
  port: 22
  host_var: VPS00_HOST

dokploy:
  register: true
  labels:
    - primary
    - dokploy-server

workloads: []
