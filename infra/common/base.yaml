---
# Applied to all 3 nodes. Per-node files override/extend, never duplicate.
os:
  distro: debian
  version: "12"

resources:
  vcpu: 2
  memory_gb: 2

dokploy:
  agent: true
  # node registers to Dokploy control plane via DOKPLOY_API_TOKEN (GitHub secret)
  server_url: "https://dokploy.maybeit.work"

firewall:
  # Enforced by scripts/harden-node.sh (UFW). Tunnel is outbound-only —
  # no inbound port for it, ever. SSH is the only inbound rule.
  default_policy: deny
  allow:
    - port: 22
      proto: tcp
      source: ssh_only
  fail2ban:
    enabled: true
    sshd_mode: aggressive

cloudflared:
  enabled: true
  # tunnel is outbound-only; no inbound ports exposed, no public IP needed
  tunnel_id_ref: "${CLOUDFLARE_TUNNEL_ID}"

updates:
  unattended_security: true
