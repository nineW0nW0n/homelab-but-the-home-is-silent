---
# Shared cloudflared ingress rules. Routes by hostname only — tunnel is
# outbound-only from each node, so no node IP is ever referenced here.
tunnel: "${CLOUDFLARE_TUNNEL_ID}"
credentials-file: /etc/cloudflared/creds.json

ingress:
  - hostname: dokploy.maybeit.work
    service: http://localhost:3000
  - hostname: "*.maybeit.work"
    service: http://localhost:80
  - service: http_status:404
